name: Apps bauen

# Ein neues Release (v<VERSION>) entsteht nur, wenn die Versionsnummer in version.js erhöht wurde.
# Manuell gestartet ("Run workflow") wird immer gebaut; die Dateien der aktuellen Version werden dann ersetzt.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 */3 * *'   # alle 3 Tage: Signierschlüssel im Cache frisch halten

permissions:
  contents: write

jobs:
  schluessel-frisch-halten:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Signierschlüssel abrufen (zählt als Zugriff)
        uses: actions/cache/restore@v4
        with:
          path: ~/einkauf-lokal-signatur.keystore
          key: einkauf-lokal-signatur-v1

  pruefen:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      bauen: ${{ steps.v.outputs.bauen }}
    steps:
      - uses: actions/checkout@v4
      - name: Selbsttests
        run: for t in *.test.mjs; do node "$t"; done
      - name: Versionsnummer lesen
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/^export const VERSION = '\(.*\)';/\1/p" version.js)
          [ -n "$VERSION" ] || { echo "::error::Keine VERSION in version.js"; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "bauen=nein" >> $GITHUB_OUTPUT
            echo "::notice::Version $VERSION gibt es schon – kein neues Release. Für ein Update version.js hochzählen."
          else
            echo "bauen=ja" >> $GITHUB_OUTPUT
          fi

  android:
    needs: pruefen
    if: needs.pruefen.outputs.bauen == 'ja'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.pruefen.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web-Dateien nach www kopieren
        run: |
          mkdir -p www
          cp -r index.html app.js merge.js sort.js version.js catalog.js changelog.js sprache.js style.css manifest.webmanifest icons www/

      - name: Capacitor installieren und Android-Projekt anlegen
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: App-Symbol und Versionsnummer setzen
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*dpi; do
            cp icons/icon-192.png $d/ic_launcher.png
            cp icons/icon-192.png $d/ic_launcher_round.png
          done
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "applicationId|versionCode|versionName" android/app/build.gradle

      # Gleicher Signierschlüssel bei jedem Build, sonst meldet Android beim Update "App nicht installiert".
      # Er liegt im Actions-Cache; "schluessel-frisch-halten" greift alle 3 Tage darauf zu, damit er nicht verfällt.
      - name: Signierschlüssel aus dem Cache holen
        uses: actions/cache@v4
        with:
          path: ~/einkauf-lokal-signatur.keystore
          key: einkauf-lokal-signatur-v1

      - name: Signierschlüssel anlegen (nur beim allerersten Mal) und im Build verwenden
        run: |
          KS=~/einkauf-lokal-signatur.keystore
          if [ ! -f "$KS" ]; then
            echo "::warning::Neuer Signierschlüssel erzeugt."
            keytool -genkeypair -keystore "$KS" -storepass android -alias einkauf -keypass android \
              -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Einkaufsliste lokal,O=racerman76,C=DE"
          fi
          keytool -list -keystore "$KS" -storepass android | grep -i fingerprint
          cat >> android/app/build.gradle <<EOF2

          android {
              signingConfigs {
                  debug {
                      storeFile file("$KS")
                      storePassword "android"
                      keyAlias "einkauf"
                      keyPassword "android"
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.debug } }
          }
          EOF2

      - name: APK bauen
        run: |
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Einkaufsliste-lokal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Einkaufsliste-lokal.apk

  windows:
    needs: pruefen
    if: needs.pruefen.outputs.bauen == 'ja'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.pruefen.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web-Dateien ins Programm kopieren, Versionsnummer setzen
        run: |
          mkdir -p desktop/app
          cp -r index.html app.js merge.js sort.js version.js catalog.js changelog.js sprache.js style.css manifest.webmanifest icons desktop/app/
          cd desktop && npm pkg set version="$VERSION"

      - name: Installer bauen (Einkaufsliste-lokal-Setup.exe)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd desktop
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --x64 --publish never
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/Einkaufsliste-lokal-Setup.exe

  # Jede Version bleibt als eigenes Release erhalten; die neueste ist "Latest",
  # daher funktionieren die Links .../releases/latest/download/<Datei> immer.
  release:
    needs: [pruefen, android, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.pruefen.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Als Release veröffentlichen
        run: |
          ls -la *.apk *.exe
          node release-text.mjs "$VERSION" > release-text.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" Einkaufsliste-lokal.apk Einkaufsliste-lokal-Setup.exe --clobber
          else
            gh release create "v$VERSION" Einkaufsliste-lokal.apk Einkaufsliste-lokal-Setup.exe --latest \
              --title "Einkaufsliste lokal $VERSION ($(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M'))" \
              --notes-file release-text.md
          fi
